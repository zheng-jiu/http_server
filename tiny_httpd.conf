# ============================================================
# Tiny HTTP Server 配置文件示例
# ============================================================

server {
    # ---- 基础配置 ----
    listen 8080;
    root "www";
    worker_threads 4;
    keep_alive 15;
    max_events 1024;
    log_path "tiny_httpd.log";
    log_level info;

    # ---- 安全限制 ----
    max_body_size 1048576;    # 1MB
    # rate_limit 0;           # 0 = 不限制（默认）

    # ---- 虚拟主机示例（取消注释以启用）----
    # server_name example.com {
    #     root "/var/www/example";
    # }

    # ---- Location 规则示例（取消注释已启用）----
    # location /api/ {
    #     proxy_pass "http://localhost:5000";
    # }
    # location /static/ {
    #     root "/srv/static";
    #     expires 7d;
    # }
}